name = "secretshare-api"
main = "src/index.ts"
compatibility_date = "2026-07-23"

[vars]
ALLOWED_ORIGIN = "http://localhost:5173,http://localhost:8788"
TURNSTILE_ENABLED = "false"
MAX_SECRET_BYTES = "65536"
DEFAULT_TTL_MINUTES = "1440"
MAX_TTL_MINUTES = "10080"
MAX_VIEWS_CAP = "10"
FAILED_ATTEMPTS_CAP = "5"

[[d1_databases]]
binding = "DB"
database_name = "secretshare-test"
database_id = "3ccfa9da-2b15-4974-b64a-cd314aa442e2" # placeholder: run `npm run db:create` and paste the real ID here

[triggers]
crons = ["*/5 * * * *"]
